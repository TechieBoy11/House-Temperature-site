services:
  postgres:
    image: postgres:16-alpine
    container_name: hearthline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: temperature
      POSTGRES_USER: temperature_app
      POSTGRES_PASSWORD: temperature_local
    ports:
      - "5432:5432"
    volumes:
      - hearthline-postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temperature_app -d temperature"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hearthline-postgres-data:
